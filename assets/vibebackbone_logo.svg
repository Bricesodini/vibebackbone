<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vibebackbone Logo</title>
  <desc id="desc">Minimal timeless black logo for Vibebackbone with an abstract V, rising backbone segments and wordmark.</desc>

  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- Symbol -->
  <g id="symbol" transform="translate(0,-10)" fill="#050505">
    <!-- Dynamic V / wave base -->
    <path d="M351 410
             C436 366 507 384 570 482
             C605 536 644 559 691 538
             C735 518 778 464 821 365
             C811 438 781 506 736 552
             C683 606 617 610 562 563
             C519 526 492 461 451 429
             C421 406 389 400 351 410Z"/>

    <!-- Backbone ascending segments -->
    <path d="M654 438 L692 352 L746 329 L706 443 L675 486 Z"/>
    <path d="M719 493 L776 308 L837 282 L775 482 L744 526 Z"/>
    <path d="M785 533 L856 250 L918 224 L836 510 L810 551 Z"/>
  </g>

  <!-- Wordmark -->
  <g id="wordmark" fill="#050505">
    <text x="600" y="700"
          text-anchor="middle"
          font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
          font-size="92"
          font-weight="800"
          letter-spacing="-4">Vibebackbone</text>
  </g>
</svg>
