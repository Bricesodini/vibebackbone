name: vbb-contracts
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Credentials gate
        env:
          VBB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VBB_HEAD_SHA: ${{ github.sha }}
        run: python3 tools/vbb-credentials-gate.py --range "$VBB_BASE_SHA" "$VBB_HEAD_SHA"
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Ruff check
        run: python3 -m ruff check tools tests
      - name: Ruff format check
        run: python3 -m ruff format --check tools tests
      - name: Mypy
        run: python3 -m mypy tools
      # Validate only closeouts changed by this push/PR. A future-dated
      # unrelated run can never become the implicit subject of this workflow.
      - name: Explicit changed-run gates
        env:
          VBB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VBB_HEAD_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "$VBB_BASE_SHA^{commit}" 2>/dev/null; then
            changed_closeouts="$(git diff --name-only "$VBB_BASE_SHA" "$VBB_HEAD_SHA" -- 'docs/runs/*/07_CLOSEOUT.md')"
          else
            changed_closeouts="$(git ls-files 'docs/runs/*/07_CLOSEOUT.md')"
          fi
          if [ -z "$changed_closeouts" ]; then
            echo "No changed run closeout to validate."
          else
            while IFS= read -r closeout; do
              run_dir="${closeout%/07_CLOSEOUT.md}"
              python3 tools/vbb-loop-closure-check.py "$run_dir" --strict
              python3 tools/vbb-adversarial-gate.py "$run_dir" --strict
            done <<EOF
          $changed_closeouts
          EOF
          fi
      - name: Adversarial corpus
        run: python3 -m pytest tests/adversarial_corpus/ -q
      - name: Contract lint
        run: python3 tools/vbb-contract-lint.py
      - name: Architecture lint
        run: python3 tools/vbb-architecture.py lint
      - name: Contract runtime dry-run
        run: python3 tools/vbb-contract-runtime.py run --all --dry-run
      - name: Runtime conformance self-test
        run: python3 tools/vbb_runtime_conformance.py self-test
      - name: Hook installer regression
        run: bash tests/test_install_vbb_hooks.sh
      - name: Pytest suite
        run: python3 -m pytest tests/ -q
