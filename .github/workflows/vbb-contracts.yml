name: vbb-contracts
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Contract lint
        run: python3 tools/vbb-contract-lint.py
      - name: Contract runtime dry-run
        run: python3 tools/vbb-contract-runtime.py run --all --dry-run
      - name: Loop closure tests
        run: python3 tests/test_loop_closure.py
      - name: Portability tests
        run: python3 tests/test_portability.py
      - name: Project init tests
        run: python3 tests/test_project_init.py