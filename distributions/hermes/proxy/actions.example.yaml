# Vibebackbone privacy proxy — action whitelist (POC).
# Copy to ~/.hermes/proxy/actions.yaml.
#
# The whitelist is the single source of truth for what the proxy is
# allowed to do (ADR 0009, ADR 0010). The POC defines exactly one
# action: vault_read, which is read-only and stub-backed.

actions:
  - id: vault_read
    description: "Read a secret from the encrypted store (POC: stub-backed fixture)."
    risk_level: low       # low | medium | high | critical
    mode: live           # dry-run | live
    permissions:
      - read
    required_params:
      - secret_id
    stub: true
