# Vibebackbone privacy proxy — runtime config (POC).
# Copy to ~/.hermes/proxy/config.yaml and edit as needed.
#
# The POC enforces the following constraints:
#   - the proxy only binds to 127.0.0.1
#   - the proxy only accepts a single action (vault_read)
#   - the secrets.key file MUST be mode 0o600
#   - ~/.hermes/proxy/ MUST be mode 0o700
#   - secrets.enc MUST be mode 0o600

host: 127.0.0.1
port: 9911

# "stub" because the POC does not run an LLM (see ADR 0006 D1, ADR 0012 D1).
# V2 will plug a local Ollama / MLX model in here.
model: stub

log_level: INFO

hmac:
  key_path: ~/.hermes/proxy/hmac.key
  timestamp_skew_seconds: 300  # anti-replay window (ADR 0010)

secrets:
  store_path: ~/.hermes/proxy/secrets.enc
  key_path: ~/.hermes/proxy/secrets.key

audit:
  dir: ~/.hermes/proxy/audit
  file_prefix: audit-
  file_suffix: .log

# Whitelist (must be present at boot; the proxy refuses to start
# without it — see ADR 0010).
actions_path: ~/.hermes/proxy/actions.yaml

fixtures:
  # Stub fixture for the vault_read action. Path is relative to the
  # vibebackbone repo root unless absolute.
  vault_read_response_path: tools/proxy/fixtures/vault_read_response.json

payload:
  max_bytes: 65536   # 64 KB hard cap (ADR 0012)
  soft_bytes: 4096   # 4 KB nominal cap

crypto:
  # "libsodium" (XChaCha20-Poly1305 SecretStream) or "cryptography" (AES-256-GCM fallback)
  backend: libsodium
