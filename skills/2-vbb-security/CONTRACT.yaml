id: 2-vbb-security
version: '0.3'
type: prompt_skill
formalization_level: declarative
entrypoint:
  kind: markdown_prompt
  path: SKILL.md
compatibility:
  runtime_required: false
  agents:
  - claude-code
  - codex
  - pi
  - opencode
verdict_mapping:
  READY: PASS
  PARTIAL: PARTIAL
  BLOCKED: FAIL
  UNKNOWN: PARTIAL
inputs:
  required:
  - project_repo
  optional:
  - docs/PROJECT_MODE.md
  - docs/AUDIT_STATUS.md
  - docs/CONTEXT.md
  - config_env
blocking_conditions:
- condition: no_access_to_entry_points
  action: STOP
  message: No code or architecture access observable
- condition: system_too_partial
  action: UNKNOWN
  message: System too partial for meaningful audit — conclude with dominant UNKNOWN
- condition: audit_without_scope
  action: CLARIFY
  message: Audit requested without perimeter — request clarification
outputs:
  required:
  - status
  - summary
  - findings
  - next_action
  statuses:
  - PASS
  - PARTIAL
  - FAIL
  - BLOCKED
  artifact:
    path_pattern: docs/runs/{run_id}/02_AUDIT.md
    template: docs/templates/02_AUDIT.md.template
    must_exist_after_run: true
    kind: phase_artifact
    frontmatter_required:
    - run_id
    - phase
    - voie
    - status
    - agent
    - started_at
    - ended_at
    - next_phase
    - artifacts_consumed
    - artifacts_produced
  secondary_artifacts:
  - path_pattern: docs/audits/security-{YYYYMMDD-HHMM}.md
    kind: audit_report
    must_exist_after_run: true
  - path_pattern: docs/AUDIT_STATUS.md
    kind: persistent_state_update
    must_exist_after_run: true
gates:
  before: []
  success:
  - id: findings_present
    output_must_contain:
    - findings
  - id: status_present
    output_must_contain:
    - status
events:
  on_success:
  - skill: t-vbb-status-report
    reason: Emit condensed post-audit report
routing:
  phase_scope:
  - audit
  - phase_2
  finding_id_prefix: SEC
  triggers:
  - security audit
  - audit sécurité
  - vulnérabilités
  excludes:
  - performance
  - business_logic_correctness
  - global_architecture
limits:
  max_gate_depth: 2
  circular_dependencies: forbidden
state_policy:
  persistent: false
  allowed_fields:
  - findings_count
  - severity_distribution
  - verdict
