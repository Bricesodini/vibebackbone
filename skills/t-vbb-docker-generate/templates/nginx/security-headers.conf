# ═══════════════════════════════════════════════════════════════
# security-headers.conf — Headers de sécurité Nginx
# Généré par T-vbb-docker-generate
# Include dans tous les server blocks
# ═══════════════════════════════════════════════════════════════

# Désactive la version Nginx dans les headers
server_tokens off;

# Protection contre le clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Prévention du MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Protection XSS (legacy, CSP preferred)
add_header X-XSS-Protection "1; mode=block" always;

# Contrôle du Referer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Feature-Policy / Permissions-Policy
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS (activer uniquement après confirmation HTTPS fonctionnel)
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;