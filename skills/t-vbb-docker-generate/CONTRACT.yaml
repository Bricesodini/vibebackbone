id: t-vbb-docker-generate
version: '0.3'
contract_schema_version: '0.3'
type: prompt_skill
formalization_level: declarative
entrypoint:
  kind: markdown_prompt
  path: SKILL.md
compatibility:
  runtime_required: false
  agents:
  - claude-code
  - codex
  - pi
  - opencode
inputs:
  required:
  - repo_access
  - docker_audit_report
  optional:
  - environment_config
  - port_config
  - base_image_preference
outputs:
  required:
  - status
  - summary
  - generated_files
  - next_action
  statuses:
  - PASS
  - PARTIAL
  - FAIL
  - BLOCKED
  artifact:
    path_pattern: docs/audits/docker-generate-{YYYYMMDD-HHMM}.md
    kind: audit_report
    must_exist_after_run: true
  secondary_artifacts:
  - path_pattern: Dockerfile
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: .dockerignore
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: docker-compose.dev.yml
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: docker-compose.staging.yml
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: docker-compose.prod.yml
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: .env.dev
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: .env.staging
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: .env.prod
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: .env.example
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: nginx/nginx.conf
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: nginx/security-headers.conf
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: docker-services.map
    kind: infrastructure_file
    must_exist_after_run: true
  - path_pattern: .gitignore
    kind: persistent_state_update
    must_exist_after_run: false
  - path_pattern: docs/AUDIT_STATUS.md
    kind: persistent_state_update
    must_exist_after_run: false
gates:
  before:
  - id: docker_audit_done
    expected_status: PASS
    blocking: true
    reason: Docker generation requires prior audit from t-vbb-docker-audit
  success:
  - id: files_generated
    output_must_contain:
    - generated_files
  after: []
events:
  on_blocked:
  - skill: t-vbb-docker-audit
    reason: No docker audit → run docker audit first
  on_partial:
  - skill: t-vbb-docker-audit
    reason: Partial generation → re-audit for missing config
  on_success:
  - skill: t-vbb-commit-ready
    reason: Docker files generated → prepare commit
routing:
  phase_scope:
  - transverse
  triggers:
  - docker generate
  - dockerfile creation
  - compose file generation
  - multi-environment docker
  - dev staging prod
  - containerization
limits:
  max_gate_depth: 2
  circular_dependencies: forbidden
state_policy:
  persistent: false
  allowed_fields:
  - dockerfile_count
  - compose_count
  - env_template_count
