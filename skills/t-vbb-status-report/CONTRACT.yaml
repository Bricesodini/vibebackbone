id: t-vbb-status-report
version: '0.3'
contract_schema_version: '0.3'
type: prompt_skill
formalization_level: declarative
entrypoint:
  kind: markdown_prompt
  path: SKILL.md
compatibility:
  runtime_required: false
  agents:
  - claude-code
  - codex
  - pi
  - opencode
inputs:
  required:
  - source_artifacts
  optional:
  - context
  - scope
outputs:
  required:
  - status
  - summary
  - findings
  - next_action
  statuses:
  - PASS
  - PARTIAL
  - FAIL
  - BLOCKED
  artifact: null
gates:
  before: []
  success:
  - id: summary_required
    output_must_contain:
    - summary
  - id: findings_present
    output_must_contain:
    - findings
events:
  on_success:
  - skill: t-vbb-session-handoff
    reason: Prepare session re-entry
  on_partial:
  - skill: t-vbb-mode-transition-gate
    reason: Report residual conditions
routing:
  phase_scope:
  - closeout
  triggers:
  - status
  - rapport
  - bilan
limits:
  max_gate_depth: 2
  circular_dependencies: forbidden
state_policy:
  persistent: false
  allowed_fields:
  - report_date
  - source_artifacts
