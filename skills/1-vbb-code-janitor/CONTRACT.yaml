id: 1-vbb-code-janitor
version: '0.3'
contract_schema_version: '0.3'
type: prompt_skill
formalization_level: declarative
entrypoint:
  kind: markdown_prompt
  path: SKILL.md
compatibility:
  runtime_required: false
  agents:
  - claude-code
  - codex
  - pi
  - opencode
inputs:
  required:
  - repo_access
  optional:
  - file_filter
  - CONVENTIONS.md
  - scope_filter
outputs:
  required:
  - status
  - summary
  - findings
  - next_action
  statuses:
  - PASS
  - PARTIAL
  - FAIL
  - BLOCKED
  artifact: null
gates:
  before: []
  success:
  - id: findings_reported
    output_must_contain:
    - findings
  after: []
events:
  on_partial:
  - skill: t-vbb-impact-analyzer
    reason: Janitor findings → analyser l'impact
  on_success:
  - skill: t-vbb-commit-ready
    reason: Cleanup ready → prepare commit
routing:
  phase_scope:
  - phase_1
  triggers:
  - code janitor
  - cleanup
  - dead code
  - unused imports
  - janitor
limits:
  max_gate_depth: 2
  circular_dependencies: forbidden
state_policy:
  persistent: false
  allowed_fields:
  - files_cleaned
  - findings_count
