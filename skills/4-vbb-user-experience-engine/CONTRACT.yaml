id: 4-vbb-user-experience-engine
version: '0.3'
contract_schema_version: '0.3'
type: prompt_skill
formalization_level: declarative

entrypoint:
  kind: markdown_prompt
  path: SKILL.md

compatibility:
  runtime_required: false
  agents:
    - claude-code
    - codex
    - pi
    - opencode

inputs:
  required:
    - repo_access
    - interface_description
    - target_user
    - primary_task
    - usage_context
  optional:
    - existing_feedback
    - prior_audits

outputs:
  required:
    - status
    - summary
    - graphic_propagation_map
    - surface_cartography
    - state_matrix
    - next_action
  statuses:
    - PASS
    - PARTIAL
    - FAIL
    - BLOCKED
  artifact:
    path_pattern: pass-1-output.md
    kind: phase_artifact
    must_exist_after_run: false
    frontmatter_required:
      - run_id
      - phase
      - voie
      - status
      - mode

gates:
  before:
    - id: repo_accessible
      expected_status: PASS
      blocking: true
      reason: Cannot optimize UX without repo access
    - id: interface_description_provided
      expected_status: PASS
      blocking: true
      reason: Cannot produce GRAPHIC_PROPAGATION_MAP without interface context
  success:
    - id: propagation_architecture_documented
      output_must_contain:
        - GRAPHIC_PROPAGATION_MAP
        - SURFACE_CARTOGRAPHY
        - STATE_MATRIX
  after:
    - id: next_pass_ready
      skill: 4-vbb-interaction-coherence-auditor
      reason: Pass 1 complete → handoff to pass 2

events:
  on_blocked:
    - skill: t-vbb-session-handoff
      reason: Pass 1 blocked → GRAPHIC_PROPAGATION_MAP must be produced before continuing
  on_success:
    - skill: t-vbb-session-handoff
      reason: Pass 1 complete → record GRAPHIC_PROPAGATION_MAP + SURFACE_CARTOGRAPHY + STATE_MATRIX

routing:
  phase_scope:
    - phase_4
  triggers:
    - front pipeline pass 1
    - user experience optimization
    - surface cartography
    - graphic propagation
    - UI/UX optimization

limits:
  max_gate_depth: 2
  circular_dependencies: forbidden

state_policy:
  persistent: false
  allowed_fields:
    - propagation_points_count
    - surfaces_identified
    - fake_centers_found
    - inheritance_chains_documented
    - propagation_debt_score

blocking_rules:
  - id: graphic_propagation_map_required
    condition: "graphic_propagation_map absent"
    level: HARD
    message: "GRAPHIC_PROPAGATION_MAP is mandatory in Pass 1. It must be produced BEFORE surface cartography. Propagation architecture > component abstraction."
  - id: surface_cartography_required
    condition: "surface_cartography absent"
    level: HARD
    message: "Surface cartography missing. Pass 1 must produce SURFACE_CARTOGRAPHY before any design system work."
  - id: state_matrix_required
    condition: "state_matrix absent"
    level: HARD
    message: "STATE_MATRIX missing. Cannot validate pass 4 without 7 states mapped to surfaces."
  - id: no_design_system_before_propagation
    condition: "proposes Button/Card/Badge registries or token expansion BEFORE GRAPHIC_PROPAGATION_MAP"
    level: HARD
    message: "GENERIC_DESIGN_SYSTEM_RESPONSE detected. Propagation architecture must be documented before any design system creation (registries, tokens, migration)."