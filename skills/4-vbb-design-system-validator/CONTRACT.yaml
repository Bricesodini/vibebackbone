id: 4-vbb-design-system-validator
version: "0.3"
contract_schema_version: "0.3"
type: prompt_skill
formalization_level: declarative

entrypoint:
  kind: markdown_prompt
  path: SKILL.md

compatibility:
  runtime_required: false
  agents:
    - claude-code
    - codex
    - pi
    - opencode

inputs:
  required:
    - repo_access
    - surface_cartography
    - state_matrix
  optional:
    - design_token_map
    - component_inventory
    - mode_preference

outputs:
  required:
    - status
    - summary
    - centralization_audit
    - token_definition_map
    - centralization_gaps
    - centralization_roadmap
    - token_coverage
    - next_action
  statuses:
    - PASS
    - PARTIAL
    - FAIL
    - BLOCKED
  artifact:
    path_pattern: pass-4-output.md
    kind: phase_artifact
    must_exist_after_run: false
    frontmatter_required: []

gates:
  before:
    - id: surface_cartography_available
      expected_status: PASS
      blocking: true
      reason: "Pass 4 requires SURFACE_CARTOGRAPHY from pass 1 before any token analysis"
    - id: state_matrix_available
      expected_status: PASS
      blocking: true
      reason: "Pass 4 requires STATE_MATRIX from pass 1 for state coverage"
    - id: passes_1_2_3_complete
      expected_status: PASS
      blocking: true
      reason: "Design system validation requires completed UX, interaction, and cognitive load passes"
  success:
    - id: design_system_validated
      output_must_contain:
        - centralization_audit
        - token_definition_map
        - token_coverage
  after:
    - id: next_pass_ready
      skill: t-vbb-session-handoff
      reason: "Pass 4 complete (hard gate passed) → handoff for visual identity layer (pass 5/7)"

events:
  on_blocked:
    - skill: t-vbb-session-handoff
      reason: "Design system not ready → handoff to resolve issues before visual work"
  on_partial:
    - skill: t-vbb-session-handoff
      reason: "Partial design system validation → handoff for remediation"
  on_success:
    - skill: t-vbb-session-handoff
      reason: "Design system validated → record handoff"

routing:
  phase_scope:
    - phase_4
  triggers:
    - design system validation
    - design token coverage
    - inline style risk
    - component reuse
    - hard gate
    - front pipeline pass 4
    - graphic centralization audit
    - token definition map
    - single source of truth

limits:
  max_gate_depth: 2
  circular_dependencies: forbidden

state_policy:
  persistent: false
  allowed_fields:
    - centralization_score_pct
    - surfaces_token_based_pct
    - token_coverage_pct
    - inline_style_count
    - reuse_pct
    - centralization_gaps_count

blocking_rules:
  - id: surface_cartography_required
    condition: "surface_cartography absent"
    level: HARD
    message: "Surface cartography missing. Pass 1 must produce SURFACE_CARTOGRAPHY before pass 4 can execute."
  - id: state_matrix_required
    condition: "state_matrix absent"
    level: HARD
    message: "State matrix missing. Cannot validate token coverage without STATE_MATRIX from pass 1."
  - id: no_duplicate_token_definitions
    condition: "TOKEN_DEFINITION_MAP contains DUPLICATES"
    level: HARD
    message: "Duplicate token definitions found. All duplicates must be resolved before pass 4 can pass."
